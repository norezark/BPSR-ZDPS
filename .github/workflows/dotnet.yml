name: Illusion Energy build

on:
  push:
    branches: ["feature/illusion-energy"]
  pull_request:
    branches: ["feature/illusion-energy"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Test and package fork
        shell: pwsh
        run: ./scripts/Publish-FactorEnergy.ps1 -Version "ci-${{ github.run_number }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZDPS-IllusionEnergy-win-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS-*.txt
            artifacts/verification-*.txt
